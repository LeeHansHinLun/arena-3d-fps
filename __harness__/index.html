      (function () {
        let s = 0x2f6e2b1 ^ 12345;
        Math.random = function () {
          s ^= s << 13; s >>>= 0;
          s ^= s >> 17;
          s ^= s << 5; s >>>= 0;
          return s / 4294967296;
        };
      })();
